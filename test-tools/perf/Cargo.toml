[package]
name = "alloc-perf"
authors.workspace = true
homepage.workspace = true
license.workspace = true
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
bytemuck.workspace = true
itoa.workspace = true
linked_list_allocator = { workspace = true, optional = true }
solana-program.workspace = true

solana-allocator = { workspace = true, optional = true, features = ["__internal"] }

[features]
default = []
custom-heap = []
custom-panic = []
free = []
rev-free = ["free"]
bump-alloc = ["dep:solana-allocator", "custom-heap"]
ll-alloc = ["dep:linked_list_allocator", "custom-heap"]
small-count = []
